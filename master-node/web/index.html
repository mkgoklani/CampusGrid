<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusGrid Command Center</title>
    <style>
        :root {
            /* Warm, minimalist earthy palette matching the image */
            --bg-color: #f3f0ea; 
            --text-main: #2b2b2b;
            --text-muted: #737373;
            --button-bg: #1a1a1a;
            --button-text: #f3f0ea;
            
            /* Neumorphic shadow colors */
            --shadow-dark: #d5d1c8;
            --shadow-light: #ffffff;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            /* Mixing serif for headings, sans-serif for UI elements */
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 40px;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', 'Georgia', serif;
            font-weight: 500;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 32px;
            color: #1a1a1a;
        }

        .stats-bar {
            display: flex;
            gap: 30px;
        }

        /* Neumorphic Raised Card */
        .neumorphic-outset {
            background: var(--bg-color);
            border-radius: 20px;
            box-shadow: 10px 10px 20px var(--shadow-dark), 
                       -10px -10px 20px var(--shadow-light);
        }

        .stat-card {
            padding: 20px 35px;
            text-align: center;
            min-width: 100px;
        }

        .stat-card h3 { font-size: 28px; margin-bottom: 5px; }
        .stat-card p { margin: 0; color: var(--text-muted); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
        }

        .panel {
            padding: 35px;
        }

        .panel h2 { 
            font-size: 24px; 
            margin-bottom: 25px; 
            color: #1a1a1a;
        }

        /* Table Styling - Clean and Minimal */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px 10px;
            text-align: left;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        th { 
            color: var(--text-muted); 
            font-weight: normal; 
            font-size: 12px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Neumorphic Inset (Track for progress bars) */
        .progress-container {
            background: var(--bg-color);
            border-radius: 50px;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), 
                        inset -5px -5px 10px var(--shadow-light);
            height: 12px;
            width: 100%;
            margin-top: 15px;
            overflow: hidden;
        }

        /* Smooth, dark fill for the progress bar to match the buttons */
        .progress-bar {
            background: var(--text-main);
            height: 100%;
            width: 0%; /* Will be updated via JS */
            border-radius: 50px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Dark contrasting button from the image */
        .btn {
            background: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 16px 32px;
            border-radius: 4px; /* Slightly square like the image */
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: opacity 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .btn:hover { 
            opacity: 0.85; 
        }
        
        .job-card {
            margin-bottom: 25px;
        }
        
        .job-card strong {
            font-family: 'Playfair Display', 'Georgia', serif;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Timeless compute, <br>made for the grid.</h1>
        <div class="stats-bar">
            <div class="stat-card neumorphic-outset">
                <h3 id="stat-total">0</h3>
                <p>Total Nodes</p>
            </div>
            <div class="stat-card neumorphic-outset">
                <h3 id="stat-idle">0</h3>
                <p>Available</p>
            </div>
            <div class="stat-card neumorphic-outset">
                <h3 id="stat-busy">0</h3>
                <p>Rendering</p>
            </div>
        </div>
    </div>

    <div class="dashboard-grid">
        <!-- Left Column: Worker Telemetry -->
        <div class="panel neumorphic-outset">
            <h2>Active Worker Nodes</h2>
            <table>
                <thead>
                    <tr>
                        <th>Node ID</th>
                        <th>Status</th>
                        <th>CPU Usage</th>
                        <th>RAM Usage</th>
                        <th>Temp</th>
                        <th>Current Job</th>
                    </tr>
                </thead>
                <tbody id="worker-table-body">
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 40px 0;">Awaiting node connections...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Right Column: Active Jobs & Controls -->
        <div class="panel neumorphic-outset">
            <h2>Execution Queue</h2>
            <div id="job-container">
                <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 30px;">No active workloads.</p>
            </div>

            <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.05); margin: 30px 0;">
            
            <button class="btn" onclick="submitTestJob()">Submit Workload</button>
        </div>
    </div>

    <script>
        // 1. Submit Workload to Master REST API
        async function submitTestJob() {
            const jobName = prompt("Enter Workload Name:", "Blender Render Scene");
            if (!jobName) return;
            const totalFrames = parseInt(prompt("Enter Total Frames (e.g. 50, 100, 300):", "50") || "50");

            try {
                const res = await fetch('/api/jobs/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jobName: jobName,
                        workloadType: "BLENDER",
                        totalFrames: totalFrames,
                        framesPerTask: 25
                    })
                });
                const result = await res.json();
                if (result.success) {
                    alert(`Workload [${result.jobId}] successfully submitted with ${result.subTasks} sub-tasks!`);
                    fetchJobs();
                } else {
                    alert("Submission failed: " + JSON.stringify(result));
                }
            } catch (err) {
                alert("Error connecting to Master API: " + err.message);
            }
        }

        // 2. Fetch and render Active Jobs from REST API
        async function fetchJobs() {
            try {
                const res = await fetch('/api/jobs');
                const jobs = await res.json();
                renderJobs(jobs);
            } catch (e) {
                console.error("Error fetching jobs:", e);
            }
        }

        function renderJobs(jobs) {
            const container = document.getElementById('job-container');
            if (!jobs || jobs.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); font-size: 14px; margin-bottom: 30px;">No active workloads.</p>';
                return;
            }

            container.innerHTML = '';
            jobs.forEach(job => {
                const jobCard = document.createElement('div');
                jobCard.className = 'job-card';
                jobCard.id = `job-${job.jobId}`;
                const percentage = Math.round(parseFloat(job.progress) || 0);

                jobCard.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <strong>${job.workloadType} - ${job.jobName || job.jobId}</strong>
                        <span style="font-size: 11px; font-weight: bold; color: ${job.status === 'COMPLETED' ? '#2e7d32' : (job.status === 'RUNNING' ? '#1565c0' : '#737373')};">
                            ${job.status}
                        </span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" style="width: ${percentage}%;"></div>
                    </div>
                    <small style="color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 8px;">
                        <span>${percentage}% Complete (${job.completedTasks} / ${job.totalTasks} Tasks)</span>
                        <span>Total: ${job.totalFrames} Frames</span>
                    </small>
                `;
                container.appendChild(jobCard);
            });
        }

        // 3. Establish WebSocket Connection to the Master Node Telemetry Stream
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsHost = window.location.hostname || 'localhost';
        const ws = new WebSocket(`${wsProtocol}//${wsHost}:8082/ws/telemetry`);

        ws.onopen = () => {
            console.log('✓ Connected to Master Node Real-Time Telemetry Stream');
            fetchJobs();
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.cluster && data.workers) {
                    updateDashboardStats(data.cluster);
                    updateWorkerTable(data.workers);
                    fetchJobs(); // Keep jobs synchronized
                }
            } catch (e) {
                console.error("Error parsing telemetry frame:", e);
            }
        };

        ws.onclose = () => {
            console.warn('WebSocket stream disconnected. Falling back to HTTP polling...');
            setInterval(fetchClusterFallback, 3000);
        };

        async function fetchClusterFallback() {
            try {
                const res = await fetch('/api/cluster/status');
                const data = await res.json();
                if (data.cluster && data.workers) {
                    updateDashboardStats(data.cluster);
                    updateWorkerTable(data.workers);
                }
                fetchJobs();
            } catch (e) {}
        }

        // 4. Update Worker Telemetry Table with Real Live Metrics
        function updateWorkerTable(workers) {
            const tbody = document.getElementById('worker-table-body');
            
            if (workers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 40px 0;">Awaiting node connections...</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            workers.forEach(worker => {
                const row = document.createElement('tr');
                const tempColor = worker.cpuTemp > 75 ? '#d32f2f' : (worker.cpuTemp > 60 ? '#f57c00' : '#2e7d32');
                const statusColor = worker.status === 'IDLE' ? '#2e7d32' : (worker.status === 'BUSY' ? '#1565c0' : '#d32f2f');

                row.innerHTML = `
                    <td style="font-weight: bold; font-family: monospace;">${worker.workerId}</td>
                    <td>
                        <span style="display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; background: ${statusColor}15; color: ${statusColor};">
                            ${worker.status}
                        </span>
                    </td>
                    <td style="font-weight: 500;">${worker.cpuUsage || '0.0'}%</td>
                    <td style="font-weight: 500;">${worker.ramUsage}%</td>
                    <td style="font-weight: bold; color: ${tempColor};">${worker.cpuTemp}°C</td>
                    <td style="color: var(--text-muted); font-size: 13px;">${worker.currentJobId ? worker.currentJobId + ' (' + (worker.assignedFrames || 'Active') + ')' : 'None'}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // 5. Update the Top Dashboard Stats
        function updateDashboardStats(clusterStats) {
            document.getElementById('stat-total').innerText = clusterStats.total;
            document.getElementById('stat-idle').innerText = clusterStats.available;
            document.getElementById('stat-busy').innerText = clusterStats.busy;
        }

        // Initial Load
        fetchJobs();
        fetchClusterFallback();
    </script>
</body>
</html>
